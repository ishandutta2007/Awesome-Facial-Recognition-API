<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Cyan/Purple Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #06b6d4; }
    
    /* Subtle Dynamic Animations */
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(180px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes pulse-points {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes float-grid {
      0% { transform: stroke-dashoffset; stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }

    .scanner-line { animation: scan 4s ease-in-out infinite; }
    .pulse-point { animation: pulse-points 2.5s ease-in-out infinite; transform-origin: center; }
    .grid-mesh { stroke-dasharray: 4 4; animation: float-grid 8s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>

  <!-- Background Decorative Grid Grid Mesh -->
  <g opacity="0.15" class="grid-mesh">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240" stroke="#06b6d4" stroke-width="1"/>
    <path d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- Background Glowing Orbs (Far Behind Text) -->
  <circle cx="150" cy="150" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1020" cy="150" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Dynamic Facial Mesh / Biometric Visuals on the Right Side (Background Layer) -->
  <g transform="translate(930, 60)" opacity="0.85">
    <!-- Face Bounding Box Corners -->
    <path d="M 20,40 L 20,20 L 40,20" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#soft-glow)"/>
    <path d="M 220,40 L 220,20 L 200,20" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#soft-glow)"/>
    <path d="M 20,140 L 20,160 L 40,160" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#soft-glow)"/>
    <path d="M 220,140 L 220,160 L 200,160" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#soft-glow)"/>

    <!-- Facial Mesh Lines -->
    <path d="M 70,60 L 120,50 L 170,60 L 140,100 L 120,130 L 100,100 Z" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 120,50 L 120,130 M 70,60 L 140,100 M 170,60 L 100,100 M 70,60 L 120,150 L 170,60" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    
    <!-- Biometric Keypoints (Eyes, Nose, Mouth, Contour) -->
    <circle cx="85" cy="70" r="4" fill="#06b6d4" class="pulse-point" filter="url(#soft-glow)"/>
    <circle cx="155" cy="70" r="4" fill="#06b6d4" class="pulse-point" filter="url(#soft-glow)"/>
    <circle cx="120" cy="95" r="3" fill="#ec4899" class="pulse-point"/>
    <circle cx="100" cy="125" r="3" fill="#06b6d4" class="pulse-point"/>
    <circle cx="140" cy="125" r="3" fill="#06b6d4" class="pulse-point"/>
    <circle cx="120" cy="130" r="4" fill="#8b5cf6" class="pulse-point" filter="url(#soft-glow)"/>

    <!-- Dynamic Scanning Laser Line -->
    <line x1="10" y1="0" x2="230" y2="0" stroke="url(#accent-grad)" stroke-width="2" class="scanner-line" filter="url(#soft-glow)"/>
  </g>

  <!-- Content / Text (Foreground Layer) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="19" class="badge-text">⚡ CURATED REPOSITORY • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">
      Awesome <tspan fill="url(#primary-grad)">Facial Recognition</tspan> API
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      Enterprise SaaS Platforms, Cloud APIs &amp; Open-Source Vision Frameworks
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 208)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🎯 Face Matching</text>

      <!-- Tag 2 -->
      <rect x="157" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="169" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🛡️ Liveness Detection</text>

      <!-- Tag 3 -->
      <rect x="334" y="0" width="175" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="346" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🔍 Identity Verification</text>

      <!-- Tag 4 -->
      <rect x="521" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="533" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">⚡ Real-time APIs</text>
    </g>
  </g>
</svg>
